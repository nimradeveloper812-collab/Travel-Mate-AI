services:
  # 1. Backend FastAPI Service
  - type: web
    name: travelmate-ai-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./travelmate.db
      - key: SECRET_KEY
        value: travelmate-super-secret-jwt-key-2026
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false

  # 2. Frontend React / Vite Static Site
  - type: web
    name: travelmate-ai-frontend
    env: static
    plan: free
    rootDir: frontend-web
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        sync: false
